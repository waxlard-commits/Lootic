<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Center</title>

<link rel="stylesheet" href="support.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- Header -->

    <div class="topbar">

        <a href="profile.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Support Center</h2>

    </div>

    <!-- Welcome Card -->

    <div class="support-card">

        <i class="fa-solid fa-headset"></i>

        <h2>Need Help?</h2>

        <p>Our support team is always ready to help you.</p>

    </div>

    <!-- Support Options -->

    <div class="menu">

        <a href="#" class="item" id="telegramSupport">
            <i class="fa-brands fa-telegram"></i>
            <span>Telegram Support</span>
            <i class="fa-solid fa-angle-right"></i>
        </a>

        <a href="#" class="item" id="whatsappSupport">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp Support</span>
            <i class="fa-solid fa-angle-right"></i>
        </a>

        <a href="#" class="item" id="emailSupport">
            <i class="fa-solid fa-envelope"></i>
            <span>Email Support</span>
            <i class="fa-solid fa-angle-right"></i>
        </a>

        <a href="#" class="item" id="faq">
            <i class="fa-solid fa-circle-question"></i>
            <span>Frequently Asked Questions</span>
            <i class="fa-solid fa-angle-right"></i>
        </a>

    </div>

    <!-- Contact Form -->

    <div class="contact-box">

        <h3>Send us a Message</h3>

        <input
        type="text"
        id="subject"
        placeholder="Subject">

        <textarea
        id="message"
        rows="5"
        placeholder="Write your message..."></textarea>

        <button id="sendMessage">

            <i class="fa-solid fa-paper-plane"></i>

            Send Message

        </button>

    </div>

</div>

<script type="module" src="support.js"></script>

</body>
</html>
