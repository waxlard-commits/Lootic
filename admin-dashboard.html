<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Requests</title>

<link rel="stylesheet" href="admin-payments.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="topbar">

        <a href="admin-dashboard.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Payment Requests</h2>

    </div>

    <!-- Pending Payments -->
    <div id="paymentList">

        <!-- Example Card -->

        <div class="payment-card">

            <div class="user-info">

                <h3 id="userName">Akif</h3>

                <p id="userEmail">akif@gmail.com</p>

            </div>

            <div class="payment-info">

                <p><strong>Amount:</strong> ₹700</p>

                <p><strong>UTR:</strong> 123456789012</p>

                <p><strong>Status:</strong>
                    <span class="pending">Pending</span>
                </p>

            </div>

            <img
            src="qr.png"
            class="payment-image"
            alt="Payment Screenshot">

            <div class="buttons">

                <button class="approve-btn">
                    <i class="fa-solid fa-circle-check"></i>
                    Approve
                </button>

                <button class="reject-btn">
                    <i class="fa-solid fa-circle-xmark"></i>
                    Reject
                </button>

            </div>

        </div>

    </div>

</div>

<script type="module" src="admin-payments.js"></script>

</body>
</html>
